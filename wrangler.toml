# name 只是默认实例名，部署时可被变量覆盖、在同账号部署多个不同名的实例：
#   WORKER_NAME=proxy-a npm run deploy:named
# 等价于 wrangler deploy --name proxy-a（secret 也可按实例设置：
#   wrangler secret put ADMIN_PASS_HASH --name proxy-a）
# D1 走自动置备、按 Worker 名建库（见下方），不同名字的实例数据天然独立。
name = "vpngate-change"
main = "src/index.js"
compatibility_date = "2025-04-01"

# 非敏感配置（密码/令牌一律用 wrangler secret，不要写在这里）
[vars]
PROXY_PORT = "10001"
PROXY_USER = "proxyuser"
# ADMIN_USER = "admin"        # 管理员账号名（默认 admin，或旧版 WEB_USER）
# AGENT_USER = "agent"        # VPS agent 账号名（默认 agent）
# AUTH_PBKDF2_ITERATIONS = "210000"

# 必需的 secret（wrangler secret put <NAME>）：
#   ADMIN_PASS_HASH  管理员密码 PBKDF2-SHA256 哈希（node tools/hash-password.mjs '<密码>' 生成）
#   AGENT_TOKEN      VPS agent 独立凭证（长随机串，与管理员密码不同）
#   PROXY_PASS       代理用户密码
# 过渡兼容：只设置旧版 WEB_USER / WEB_PASS 时，管理员密码会在首次登录时
# 自动引导为 D1 中的 PBKDF2 哈希，agent 继续以旧凭证工作（见 README）。

[[d1_databases]]
binding = "DB"
# 不写 database_name / database_id：走 Wrangler 自动置备（>= 4.45）。
# 首次 deploy 时按 Worker 名字自动创建专属 D1 并绑定，后续部署自动复用同一库，
# 每个实例（不同 Worker 名）各有自己的库，互不干扰；仓库里不出现任何固定库名/ID。
# 如需手动指定现成库：在此加回 database_name + database_id 两行即可。
